name: Build and test

# Two things need guarding here, and they are not the same thing.
#
# The first is the ordinary one: the scripts must still assemble and the tests
# must still pass. The second is specific to this repository — the Plonky3
# dependencies are git dependencies with no `rev`, so `cargo update` can move
# them under us at any time. `--locked` keeps the gating job reproducible, and a
# separate non-blocking job tells us when upstream has moved, rather than letting
# the discovery arrive as a surprise in someone's working tree.

on:
  push:
    branches: [main]
  pull_request:
    # PRs stacked on an unmerged branch are checked too.
    branches: [main, test/paper-faithful-combination]
  schedule:
    # Monday morning, so drift against Plonky3 is noticed at the start of a week
    # rather than mid-review.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # These tests build multi-megabyte scripts and execute them; a backtrace is
  # worth having the first time one fails on a runner and not locally.
  RUST_BACKTRACE: 1

jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --all-targets

      # `--nocapture` on purpose. Several tests exist to print numbers — script
      # bytes, permutation counts, the transcript's share of the total — and this
      # is a sizing project, so those belong in the log where a reviewer can see
      # how a change moved them.
      - name: Test
        run: cargo test --locked -- --nocapture

  plonky3-drift:
    name: against latest Plonky3
    runs-on: ubuntu-latest
    # Never blocks a merge. Its job is to say "upstream moved and we still
    # build", or to fail loudly first so nobody debugs it from scratch.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: drift

      - name: Update the Plonky3 dependencies
        run: cargo update

      - name: Report what moved
        run: git --no-pager diff --stat Cargo.lock || true

      - name: Test against them
        run: cargo test
